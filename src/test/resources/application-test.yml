spring:
  datasource:
    url: jdbc:h2:mem:ledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

ledger:
  default-currency: RUB
  storage:
    logos-dir: ./target/test-logos
  market-data:
    quote-ttl: 10m
    quote-currency: RUB
    crypto-quote-currency: USD
  security:
    admin-emails: owner@example.com,dup@example.com,admin@example.com
    jwt:
      secret: test-secret-key-at-least-32-bytes-long
      expiration-minutes: 60
